name: Radio fixture build
on:
  push:
    branches: [radio/launch-20261101]
    paths: ['.github/workflows/radio-fixture.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  FIXTURE_SHA: d28318eaf0b4c3a767c0e0fd694d502ceda216fb
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d28318eaf0b4c3a767c0e0fd694d502ceda216fb
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Check OIDC browser-bound callback state
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {isBrowserBoundOidcState,completeGrasanyCallback,logoutGrasanySession,identityAcceptanceContext,readGrasanySession,getGrasanyPrincipal} from './worker/src/auth/grasanyIdentityFlow.js';
          import {resolveVerifiedProductIdentity,lookupSunotoProductIdentity} from './worker/src/auth/supabaseIdentityAdapter.js';
          import {GRASANY_OIDC_PACKET,getGrasanyIdentityReadiness} from './worker/src/auth/grasanyOidc.js';
          assert.equal(GRASANY_OIDC_PACKET.clientId,'689da8fc-ab29-4174-bc8c-f27509f4069d');
          assert.equal(getGrasanyIdentityReadiness().enabled,false);
          const principal={issuer:GRASANY_OIDC_PACKET.issuer,subject:'fixture-sub'};
          const row={...principal,accountId:'00000000-0000-4000-8000-000000000001',roles:['admin']};
          const mapping=await resolveVerifiedProductIdentity(principal,async q=>{assert.deepEqual(q,principal);return [row]});
          assert.deepEqual(mapping.roles,[]);assert.deepEqual(mapping.entitlements,[]);
          assert.equal(await resolveVerifiedProductIdentity(principal,async()=>[row,row]),null);
          assert.equal(await resolveVerifiedProductIdentity({...principal,issuer:'https://wrong.invalid'},async()=>{throw Error('must not lookup')}),null);
          const dbEnv={SUNOTO_PRODUCT_IDENTITY_LOOKUP:'1',SUPABASE_URL:'https://mybjgljylmcweeprhhlw.supabase.co',SUPABASE_SERVICE_ROLE_KEY:'synthetic-not-a-key'};
          const stored={issuer:principal.issuer,subject:principal.subject,account_id:row.accountId};
          const db=async(url,options)=>{
            assert.equal(url.origin,dbEnv.SUPABASE_URL);
            assert.equal(url.pathname,'/rest/v1/grasany_identity_links');
            assert.equal(url.searchParams.get('issuer'),'eq.'+principal.issuer);
            assert.equal(url.searchParams.get('subject'),'eq.'+principal.subject);
            assert.equal(options.method,'GET');assert.equal(options.redirect,'error');
            assert.equal(options.headers.authorization,'Bearer synthetic-not-a-key');
            return Response.json([stored]);
          };
          assert.equal((await lookupSunotoProductIdentity(dbEnv,principal,db)).identity.accountId,row.accountId);
          assert.equal((await lookupSunotoProductIdentity(dbEnv,principal,async()=>Response.json([]))).status,'not_linked');
          assert.equal((await lookupSunotoProductIdentity(dbEnv,principal,async()=>Response.json({}, {status:403}))).status,'service_unavailable');
          assert.equal((await lookupSunotoProductIdentity({...dbEnv,SUPABASE_URL:'https://wrong.invalid'},principal,async()=>{throw Error('must not send key')})).status,'service_unavailable');
          let deletes=0,fail=false;
          const env={IDENTITY_SESSIONS:{idFromName:x=>x,get:()=>({fetch:async (url,init)=>{
            if(init.method==='DELETE'){deletes++;return new Response(null,{status:fail?500:204});}
            return Response.json({payload:JSON.stringify({csrfToken:'fixture-csrf'})});
          }})}};
          const syntheticGuard='f'.repeat(64);
          Object.assign(env,{
            GRASANY_OIDC_ACCEPTANCE_MODE:'1',
            GRASANY_OIDC_ACCEPTANCE_SECRET:syntheticGuard,
            IDENTITY_ACCEPTANCE_SESSIONS:env.IDENTITY_SESSIONS,
            GRASANY_OIDC_ISSUER:GRASANY_OIDC_PACKET.issuer,
            GRASANY_OIDC_CLIENT_ID:GRASANY_OIDC_PACKET.clientId,
            GRASANY_OIDC_REDIRECT_URI:GRASANY_OIDC_PACKET.proposedCallback,
            GRASANY_OIDC_TOKEN_ENCRYPTION_KEY:Buffer.alloc(32,2).toString('base64url'),
          });
          env.IDENTITY_SESSIONS={idFromName(){throw Error('production session store must not be used')}};
          const gated=(provided,origin='https://sunoto.grasany.com')=>new Request(origin+'/api/v1/auth/session',{headers:provided?{'x-sunoto-identity-acceptance':provided}:{}});
          assert.equal(await identityAcceptanceContext(gated(null),env),null);
          assert.equal(await identityAcceptanceContext(gated('e'.repeat(64)),env),null);
          assert.equal(await identityAcceptanceContext(gated(syntheticGuard,'https://wrong.invalid'),env),null);
          assert.equal(await identityAcceptanceContext(gated(syntheticGuard),{...env,IDENTITY_ACCEPTANCE_SESSIONS:undefined}),null);
          assert.equal((await identityAcceptanceContext(gated(syntheticGuard),env)).IDENTITY_SESSIONS,env.IDENTITY_ACCEPTANCE_SESSIONS);
          assert.equal((await readGrasanySession(gated(null),env)).status,503);
          assert.deepEqual(await (await readGrasanySession(gated(syntheticGuard),env)).json(),{authenticated:false});
          assert.equal((await getGrasanyPrincipal(gated(syntheticGuard),env)).error,'identity_service_not_configured');
          const out=(origin,csrf)=>logoutGrasanySession(new Request('https://sunoto.grasany.com/api/v1/auth/logout',{method:'POST',headers:{origin,'x-sunoto-identity-acceptance':syntheticGuard,'x-csrf-token':csrf,cookie:'__Host-sunoto_session='+'C'.repeat(43)}}),env);
          assert.equal((await out('https://evil.invalid','fixture-csrf')).status,403);
          assert.equal((await out('https://sunoto.grasany.com','wrong')).status,403);assert.equal(deletes,0);
          fail=true;assert.equal((await out('https://sunoto.grasany.com','fixture-csrf')).status,503);
          fail=false;assert.equal((await out('https://sunoto.grasany.com','fixture-csrf')).status,204);
          const state='A'.repeat(43),other='B'.repeat(43),name='__Host-sunoto_oidc';
          const req=cookie=>new Request('https://sunoto.grasany.com/auth/callback?code=fixture&state='+state,{headers:{cookie}});
          assert.equal(isBrowserBoundOidcState(req(name+'='+state),state),true);
          for(const cookie of ['',name+'='+other,name+'=%ZZ',name+'='+state+'; '+name+'='+state])assert.equal(isBrowserBoundOidcState(req(cookie),state),false);
          assert.equal((await completeGrasanyCallback(req(name+'='+state),{})).status,503);
          console.log('OIDC state requires matching initiating-browser cookie; production readiness remains fail-closed.');
          JS
      - run: node --test test/oidc-controlled-lifecycle.test.js
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://fixture.invalid/api/v1
          VITE_SUPABASE_URL: https://fixture-db.invalid
          VITE_SUPABASE_ANON_KEY: fixture-not-a-credential
      - run: node --test test/seo-public.test.js test/production-headers.test.js
      - name: Record fixture provenance
        run: |
          printf '%s\n' "$FIXTURE_SHA" > dist/FIXTURE_SOURCE_SHA
          tar -czf sunoto-radio-fixture.tgz -C dist .
          sha256sum sunoto-radio-fixture.tgz | tee sunoto-radio-fixture.tgz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sunoto-radio-fixture-${{ env.FIXTURE_SHA }}
          path: |
            sunoto-radio-fixture.tgz
            sunoto-radio-fixture.tgz.sha256
          retention-days: 3
          if-no-files-found: error
