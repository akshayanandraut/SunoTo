name: Radio fixture build
on:
  push:
    branches: [radio/launch-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://fixture.invalid/api/v1
          VITE_SUPABASE_URL: https://fixture-db.invalid
          VITE_SUPABASE_ANON_KEY: fixture-not-a-credential
      - run: node --test test/seo-public.test.js test/production-headers.test.js
      - name: Record fixture provenance
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/FIXTURE_SOURCE_SHA
          tar -czf sunoto-radio-fixture.tgz -C dist .
          sha256sum sunoto-radio-fixture.tgz | tee sunoto-radio-fixture.tgz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sunoto-radio-fixture-${{ github.sha }}
          path: |
            sunoto-radio-fixture.tgz
            sunoto-radio-fixture.tgz.sha256
          retention-days: 3
          if-no-files-found: error
