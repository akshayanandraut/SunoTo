name: Radio fixture build
on:
  push:
    branches: [radio/launch-20261101]
  workflow_dispatch:
permissions:
  contents: read
env:
  FIXTURE_SHA: 8433c8759729b5a94743d5ae7a5aefb71daa4763
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8433c8759729b5a94743d5ae7a5aefb71daa4763
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://fixture.invalid/api/v1
          VITE_SUPABASE_URL: https://fixture-db.invalid
          VITE_SUPABASE_ANON_KEY: fixture-not-a-credential
      - run: node --test test/seo-public.test.js test/production-headers.test.js
      - name: Test the exact Worker with local R2 only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FIXTURE_SHA"
          npm install --prefix "$RUNNER_TEMP/wrangler" --no-audit --no-fund wrangler@4.156.0
          cli="$RUNNER_TEMP/wrangler/node_modules/wrangler/bin/wrangler.js"
          state="$RUNNER_TEMP/sunoto-fixture-r2"
          key="radio/00000000-0000-4000-8000-00000000f001/synthetic-fixture.wav"
          node --input-type=module - <<'JS'
          import {writeFileSync} from 'node:fs';
          const b=Buffer.alloc(8044,128);
          b.write('RIFF'); b.writeUInt32LE(b.length-8,4); b.write('WAVEfmt ',8);
          b.writeUInt32LE(16,16); b.writeUInt16LE(1,20); b.writeUInt16LE(1,22);
          b.writeUInt32LE(8000,24); b.writeUInt32LE(8000,28);
          b.writeUInt16LE(1,32); b.writeUInt16LE(8,34); b.write('data',36); b.writeUInt32LE(8000,40);
          writeFileSync(process.env.RUNNER_TEMP+'/synthetic-fixture.wav',b);
          JS
          node "$cli" r2 object put "sunoto-radio/$key" --config worker/wrangler.toml --local --persist-to "$state" --file "$RUNNER_TEMP/synthetic-fixture.wav" --content-type audio/wav
          node "$cli" dev --config worker/wrangler.toml --local --persist-to "$state" --ip 127.0.0.1 --port 8796 --var ANON_SESSION_SECRET:fixture-only-not-a-production-secret > "$RUNNER_TEMP/sunoto-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; tail -30 "$RUNNER_TEMP/sunoto-worker.log"' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8796/api/health >/dev/null; then break; fi
            sleep 1
          done
          export FIXTURE_KEY="$key"
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {signAnonymousToken} from './worker/src/auth/anonymousToken.js';
          const key=process.env.FIXTURE_KEY;
          const secret='fixture-only-not-a-production-secret';
          const now=Math.floor(Date.now()/1000);
          const sign=(sub,exp)=>signAnonymousToken({v:1,kind:'radio-media',sub,exp},secret);
          const base='http://127.0.0.1:8796/api/v1/radio-media/';
          const read=(k,t,opts)=>fetch(base+k+(t?'?t='+t:''),opts);
          assert.equal((await read(key)).status,403);
          assert.equal((await read(key,await sign(key,now-10))).status,403);
          const t=await sign(key,now+600);
          const missing=key.replace('synthetic-fixture','missing-fixture');
          assert.equal((await read(missing,await sign(missing,now+600))).status,404);
          const h=await read(key,t,{method:'HEAD'});
          assert.equal(h.status,200); assert.equal(h.headers.get('content-length'),'8044');
          const r=await read(key,t,{headers:{Range:'bytes=0-43'}});
          assert.equal(r.status,206); assert.equal(r.headers.get('content-range'),'bytes 0-43/8044');
          assert.equal((await r.text()).slice(0,4),'RIFF');
          assert.equal((await read(key,t,{headers:{Range:'bytes=99999-'}})).status,416);
          const recovered=await read(key,t);
          assert.equal(recovered.status,200); assert.equal((await recovered.arrayBuffer()).byteLength,8044);
          assert.equal((await fetch('http://127.0.0.1:8796/api/v1/auth/session')).status,503);
          console.log('Verified isolated R2 HTTP: 403 invalid/expired, 404 missing, HEAD 200, range 206/416, retry 200, account 503.');
          JS
      - name: Record fixture provenance
        run: |
          printf '%s\n' "$FIXTURE_SHA" > dist/FIXTURE_SOURCE_SHA
          tar -czf sunoto-radio-fixture.tgz -C dist .
          sha256sum sunoto-radio-fixture.tgz | tee sunoto-radio-fixture.tgz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sunoto-radio-fixture-${{ env.FIXTURE_SHA }}
          path: |
            sunoto-radio-fixture.tgz
            sunoto-radio-fixture.tgz.sha256
          retention-days: 3
          if-no-files-found: error
