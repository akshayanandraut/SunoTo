<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c16"><title>Grievance — Random Chat India</title><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/account.css"><link rel="stylesheet" href="/css/responsive.css"></head><body><main class="view container"><a class="brand" href="/"><span class="brand-mark">R</span> Random Chat</a><section class="panel" style="margin-top:28px"><p class="eyebrow">Help and compliance</p><h1>Submit a grievance</h1><p id="officer" class="muted">Loading grievance officer details…</p><p class="muted">We target acknowledgement within 24 hours and resolution within 15 days. Urgent safety matters may require faster action.</p><form id="grievance-form" class="auth-card"><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="category">Category</label><select id="category" name="category" required><option value="">Choose one</option><option value="privacy">Privacy</option><option value="safety">Safety</option><option value="account">Account</option><option value="payment">Payment</option><option value="content">Content</option><option value="other">Other</option></select></div><div class="field"><label for="description">What happened?</label><textarea id="description" name="description" minlength="20" maxlength="2000" required></textarea></div><button class="btn btn-primary">Submit grievance</button></form><p id="result" class="storage-warning" hidden></p><p class="muted">Do not include passwords, payment card data, or unnecessary personal information.</p></section></main><script type="module" src="/js/grievance.js"></script></body></html>
