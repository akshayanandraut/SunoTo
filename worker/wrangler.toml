name = "random-chat-india-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

[triggers]
crons = ["*/10 * * * *"]

[[durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"

[[durable_objects.bindings]]
name = "MATCHMAKING"
class_name = "MatchmakingShard"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceShard"

[[durable_objects.bindings]]
name = "ANONYMOUS"
class_name = "AnonymousIdentityShard"

[[durable_objects.bindings]]
name = "DEVICE_OWNERSHIP"
class_name = "DeviceOwnershipShard"

[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitShard"

[[durable_objects.bindings]]
name = "PARTY_ROOM"
class_name = "PartyRoomShard"

[[durable_objects.bindings]]
name = "LISTENER_REGISTRY"
class_name = "ListenerRegistryShard"

[[durable_objects.bindings]]
name = "FORUM_ROOM"
class_name = "ForumRoomShard"

[[r2_buckets]]
binding = "RADIO_BUCKET"
bucket_name = "sunoto-radio"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MatchmakingShard", "PresenceShard"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["AnonymousIdentityShard"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["DeviceOwnershipShard"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["RateLimitShard"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["PartyRoomShard"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["ListenerRegistryShard"]

[[migrations]]
tag = "v8"
new_sqlite_classes = ["ForumRoomShard"]

[env.dev]
vars = { ALLOW_FORCE_PERSONA = "1", ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1:5175,http://localhost:5175,http://127.0.0.1:5176,http://localhost:5176", VIDEO_BETA_OPEN = "1" }

[[env.dev.durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"

[[env.dev.durable_objects.bindings]]
name = "MATCHMAKING"
class_name = "MatchmakingShard"

[[env.dev.durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceShard"

[[env.dev.durable_objects.bindings]]
name = "ANONYMOUS"
class_name = "AnonymousIdentityShard"

[[env.dev.durable_objects.bindings]]
name = "DEVICE_OWNERSHIP"
class_name = "DeviceOwnershipShard"

[[env.dev.durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitShard"

[[env.dev.durable_objects.bindings]]
name = "PARTY_ROOM"
class_name = "PartyRoomShard"

[[env.dev.durable_objects.bindings]]
name = "LISTENER_REGISTRY"
class_name = "ListenerRegistryShard"

[[env.dev.durable_objects.bindings]]
name = "FORUM_ROOM"
class_name = "ForumRoomShard"

[[env.dev.r2_buckets]]
binding = "RADIO_BUCKET"
bucket_name = "sunoto-radio-dev"
