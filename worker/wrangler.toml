name = "sunoto"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Serve the built frontend (dist/, produced by `npm run build`) from this same Worker, so the site
# and its API share one origin and one deployment. run_worker_first routes only /api/* to the Worker
# code; every other path is served as a static file. Same-origin also means the browser never makes a
# cross-origin API call, so ALLOWED_ORIGINS stops being load-bearing for the first-party frontend.
# not_found_handling is "404-page" (not SPA rewriting) because this app uses hash routing -- real
# paths always map to a real built file (/, /admin.html, /privacy.html, ...).
[assets]
directory = "../dist"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[triggers]
crons = ["*/10 * * * *"]

[[durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"

[[durable_objects.bindings]]
name = "MATCHMAKING"
class_name = "MatchmakingShard"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceShard"

[[durable_objects.bindings]]
name = "ANONYMOUS"
class_name = "AnonymousIdentityShard"

[[durable_objects.bindings]]
name = "DEVICE_OWNERSHIP"
class_name = "DeviceOwnershipShard"

[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitShard"

[[durable_objects.bindings]]
name = "PARTY_ROOM"
class_name = "PartyRoomShard"

[[durable_objects.bindings]]
name = "LISTENER_REGISTRY"
class_name = "ListenerRegistryShard"

[[durable_objects.bindings]]
name = "FORUM_ROOM"
class_name = "ForumRoomShard"

[[durable_objects.bindings]]
name = "ARENA_LOBBY"
class_name = "ArenaLobbyShard"

# R2 (media storage for avatars + radio track audio/artwork) is intentionally NOT bound by default.
# Cloudflare refuses to deploy a Worker whose config references an R2 bucket before R2 is enabled on
# the account ("Please enable R2 through the Cloudflare Dashboard", API error 10042), which blocks the
# entire deploy over an optional feature. The Worker handles a missing RADIO_BUCKET gracefully:
# requireMediaStorage() in src/index.js returns 503 media_storage_unavailable from the upload/serve
# routes, everything else works normally.
#
# To turn media uploads on: enable R2 in the Cloudflare dashboard, create the bucket
# (`npx wrangler r2 bucket create sunoto-radio`), then uncomment the block below (and the matching
# [[env.dev.r2_buckets]] block further down for local dev).
#
# [[r2_buckets]]
# binding = "RADIO_BUCKET"
# bucket_name = "sunoto-radio"

[ai]
binding = "AI"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MatchmakingShard", "PresenceShard"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["AnonymousIdentityShard"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["DeviceOwnershipShard"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["RateLimitShard"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["PartyRoomShard"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["ListenerRegistryShard"]

[[migrations]]
tag = "v8"
new_sqlite_classes = ["ForumRoomShard"]

[[migrations]]
tag = "v9"
new_sqlite_classes = ["ArenaLobbyShard"]

[env.dev]
vars = { ALLOW_FORCE_PERSONA = "1", ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174,http://127.0.0.1:5175,http://localhost:5175,http://127.0.0.1:5176,http://localhost:5176", VIDEO_BETA_OPEN = "1" }

[[env.dev.durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"

[[env.dev.durable_objects.bindings]]
name = "MATCHMAKING"
class_name = "MatchmakingShard"

[[env.dev.durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceShard"

[[env.dev.durable_objects.bindings]]
name = "ANONYMOUS"
class_name = "AnonymousIdentityShard"

[[env.dev.durable_objects.bindings]]
name = "DEVICE_OWNERSHIP"
class_name = "DeviceOwnershipShard"

[[env.dev.durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitShard"

[[env.dev.durable_objects.bindings]]
name = "PARTY_ROOM"
class_name = "PartyRoomShard"

[[env.dev.durable_objects.bindings]]
name = "LISTENER_REGISTRY"
class_name = "ListenerRegistryShard"

[[env.dev.durable_objects.bindings]]
name = "FORUM_ROOM"
class_name = "ForumRoomShard"

[[env.dev.durable_objects.bindings]]
name = "ARENA_LOBBY"
class_name = "ArenaLobbyShard"

# See the R2 note above -- uncomment alongside the top-level [[r2_buckets]] block.
# [[env.dev.r2_buckets]]
# binding = "RADIO_BUCKET"
# bucket_name = "sunoto-radio-dev"

# Deliberately NOT bound under [env.dev]: wrangler dev requires the AI binding to establish a
# remote proxy connection to Cloudflare (Workers AI cannot be emulated locally at all), which in
# turn requires a CLOUDFLARE_API_TOKEN env var just to start the dev server -- even when the
# virtual-persona feature itself is disabled. Bound only at the top level (production deploy),
# where the Worker authenticates via its own account context automatically, no token needed.
